<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Philippines - Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #ddd;
        }

        header h1 {
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        nav {
            background-color: #333;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .gallery {
            padding: 40px;
            text-align: center;
        }

        .gallery h2 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        .gallery-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .gallery-card {
            background-color: white;
            width: 250px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        .gallery-image {
            height: 180px;
            background-color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .gallery-card h3 {
            padding: 10px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌴 EXPLORE PARADISE</h1>
        <p>Discover. Explore. Experience.</p>
    </header>

    <nav>
        <a href="Tourist.html">HOME</a>
        <a href="destinations.html">DESTINATIONS</a>
        <a href="activities.html">ACTIVITIES</a>
        <a href="gallery.html">GALLERY</a>
    </nav>

    <section class="gallery">

        <h2>Tourist Spot Gallery</h2>

        <div class="gallery-grid">

            <div class="gallery-card">
                <div class="gallery-image"></div>
                <h3>Boracay</h3>
            </div>

            <div class="gallery-card">
                <div class="gallery-image"></div>
                <h3>Banaue</h3>
            </div>

            <div class="gallery-card">
                <div class="gallery-image"></div>
                <h3>Palawan</h3>
            </div>

            <div class="gallery-card">
                <div class="gallery-image"></div>
                <h3>Baguio City</h3>
            </div>

        </div>

    </section>

    <footer>
        <h3>Explore Philippines</h3>
        <p>Your guide to the beautiful tourist spots in the Philippines.</p>
    </footer>

</body>
</html>
